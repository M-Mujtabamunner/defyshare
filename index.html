<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply a saved dark-mode choice before first paint (see ThemeProvider). -->
    <script>
      try {
        if (localStorage.getItem('defyshare:theme') === 'dark') {
          var r = document.documentElement;
          r.classList.replace('light', 'dark');
          r.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>

    <!-- Per-route title, description, canonical and og/twitter tags are written into
         each page's HTML at build time by scripts/prerender-seo.mjs. -->
    <title>DefyShare: Share Files Between Phone & PC Instantly (Free)</title>
    <meta name="description" content="Send files, folders, photos, videos and text between your phone, laptop and tablet on the same Wi-Fi. No app, no sign-up — just open and drop. 100% free." />
    <link rel="canonical" href="https://defyshare.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DefyShare" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="DefyShare: Share Files Between Phone & PC Instantly (Free)" />
    <meta property="og:description" content="Send files, folders, photos, videos and text between your phone, laptop and tablet on the same Wi-Fi. No app, no sign-up — just open and drop. 100% free." />
    <meta property="og:url" content="https://defyshare.app/" />
    <meta property="og:image" content="https://defyshare.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DefyShare — share files and text between devices on the same Wi-Fi" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@defyshare" />
    <meta name="twitter:title" content="DefyShare: Share Files Between Phone & PC Instantly (Free)" />
    <meta name="twitter:description" content="Send files, folders, photos, videos and text between your phone, laptop and tablet on the same Wi-Fi. No app, no sign-up — just open and drop. 100% free." />
    <meta name="twitter:image" content="https://defyshare.app/og-image.png" />

    <!-- Icons: white plane on brand orange so it stays visible in search results and tabs -->
    <link rel="icon" href="/favicon.ico?v=9" sizes="any" />
    <link rel="icon" href="/icons/icon-48.png?v=9" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icons/icon-96.png?v=9" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon.png?v=9" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest?v=9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DefyShare" />
    <meta name="application-name" content="DefyShare" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Warm up connections the app needs on first paint -->
    <link rel="preconnect" href="https://zdkstkgwgggssvyjipqp.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.ipify.org" crossorigin />
    <link rel="preconnect" href="https://s3.us-east-005.backblazeb2.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://defyshare.app/#organization",
          "name": "DefyShare",
          "url": "https://defyshare.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://defyshare.app/logo-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://defyshare.app/#website",
          "name": "DefyShare",
          "url": "https://defyshare.app/",
          "publisher": { "@id": "https://defyshare.app/#organization" }
        },
        {
          "@type": "WebApplication",
          "name": "DefyShare",
          "url": "https://defyshare.app/",
          "description": "Free browser app for sending files, folders and text between phones, tablets and computers on the same Wi-Fi network. No account or install needed; shared items are deleted after 3 hours.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Windows, macOS, Linux, Android, iOS, ChromeOS",
          "browserRequirements": "Requires a modern web browser",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "image": "https://defyshare.app/og-image.png",
          "featureList": [
            "No account required",
            "Works in any modern browser",
            "Any file type, including folders, ZIP and RAR",
            "Real-time text and link sharing",
            "Drag and drop or paste to upload",
            "Files auto-delete after 3 hours"
          ],
          "publisher": { "@id": "https://defyshare.app/#organization" }
        }
      ]
    }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3440868789646344" crossorigin="anonymous"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
